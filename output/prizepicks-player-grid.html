</style>
  <section aria-label="Baseline player grid with the PrizePicks color palette">
      <div class="home grid" data-layout="grid" aria-label="PrizePicks color scheme" data-palette="prizepicks">
        <header class="nav"><div class="brand"><i aria-hidden="true"></i>Baseline</div></header>
        <main class="content">
          <div class="heading"><div><h1>Players</h1></div></div>
          
          <div class="toolbar"><label class="search-field"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Search by player name" aria-label="Search players"></label><select class="season" aria-label="Season"><option>2026</option><option>2025</option><option>2024</option></select></div>
          <div class="section-head" aria-label="Player results"><span class="result-count"></span></div><div class="players"></div><div class="preview" hidden=""></div>
          
        </main>
      </div>
    </section>
  <script>
  (()=>{
    const root=document.getElementById('baseline-prizepicks-mock');
    const players=[
      {name:'A’ja Wilson',team:'Las Vegas Aces',gp:49,stats:[25.9,9.1,2.9]},
      {name:'Caitlin Clark',team:'Indiana Fever',gp:40,stats:[22.4,5.6,8.7]},
      {name:'Napheesa Collier',team:'Minnesota Lynx',gp:41,stats:[23.2,8.4,3.3]},
      {name:'Breanna Stewart',team:'New York Liberty',gp:39,stats:[21.1,7.8,3.6]},
      {name:'Sabrina Ionescu',team:'New York Liberty',gp:38,stats:[18.2,4.4,6.1]},
      {name:'Alyssa Thomas',team:'Phoenix Mercury',gp:40,stats:[15.4,8.9,9.2]}
    ];
    root.querySelectorAll('[data-layout]').forEach(home=>{
      const layout=home.dataset.layout;
      const state={query:'',season:'2026'};
      const container=home.querySelector('.players') || home.querySelector('tbody');
      const preview=home.querySelector('.preview');
      function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
      function showPlayer(player){
        preview.hidden=false;preview.replaceChildren();
        const head=el('div','preview-head');const title=el('div');title.append(el('p','eyebrow','Sample player preview'),el('h3','',player.name+' · '+state.season));const close=el('button','close','Close');close.type='button';close.addEventListener('click',()=>{preview.hidden=true;});head.append(title,close);preview.append(head);
        const legend=el('div','legend');[['Above average','var(--green)'],['Near average','var(--amber)'],['Below average','var(--red)']].forEach(([text,color])=>{const item=el('span');const swatch=el('i');swatch.style.background=color;item.append(swatch,document.createTextNode(text));legend.append(item);});preview.append(legend);
        const chart=el('div','preview-chart');chart.setAttribute('role','img');chart.setAttribute('aria-label','Twelve sample point totals with green above average, amber near average, and red below average.');chart.append(el('div','baseline'));
        const average=player.stats[0];const factors=[.77,1.2,.91,1.03,1.31,.69,1.08,.95,1.45,.84,1.16,1.01];
        factors.forEach(f=>{const value=Math.round(average*f);const bar=el('div','bar');bar.style.setProperty('--height',value/(average*1.6)*100+'%');bar.style.setProperty('--bar-color',Math.abs(value-average)<2?'var(--amber)':value>average?'var(--green)':'var(--red)');bar.append(el('span','',String(value)));chart.append(bar);});preview.append(chart);const caption=el('div','preview-caption');caption.append(el('span','','Last 12 games · PTS'),el('span','','Season average: '+average.toFixed(1)));preview.append(caption);
      }
      function render(){
        home.querySelectorAll('.current-season').forEach(node=>node.textContent=state.season);
        const filtered=players.filter(player=>player.name.toLowerCase().includes(state.query));container.replaceChildren();
        home.querySelector('.result-count').textContent=filtered.length+' players';
        if(!filtered.length){if(layout==='directory'){const row=el('tr');const cell=el('td','empty','No players match your search.');cell.colSpan=7;row.append(cell);container.append(row);}else container.append(el('p','empty','No players match your search.'));return;}
        filtered.forEach(player=>{
          if(layout==='directory'){
            const row=el('tr');row.append(el('td','rank',String(players.indexOf(player)+1).padStart(2,'0')));const name=el('td');const button=el('button','table-name',player.name);button.type='button';button.addEventListener('click',()=>showPlayer(player));name.append(button);row.append(name,el('td','team-cell',player.team),el('td','num',String(player.gp)));player.stats.forEach((v,i)=>row.append(el('td','num'+(i===0?' points':''),v.toFixed(1))));container.append(row);
          }else{
            const button=el('button','player');button.type='button';button.setAttribute('aria-label','Preview '+player.name);const team=el('span','player-team',player.team);const arrow=el('span','arrow','↗');arrow.setAttribute('aria-hidden','true');team.append(arrow);const stats=el('span','player-stats');player.stats.forEach((v,i)=>{const s=el('span');s.append(el('b','',v.toFixed(1)),el('small','',['PPG','RPG','APG'][i]));stats.append(s);});button.append(team,el('span','player-name',player.name),stats);button.addEventListener('click',()=>showPlayer(player));container.append(button);
          }
        });
      }
      home.querySelector('input').addEventListener('input',event=>{state.query=event.target.value.toLowerCase();render();});
      home.querySelector('.season').addEventListener('change',event=>{state.season=event.target.value;preview.hidden=true;render();});
      render();
      if(globalThis.Tweak){const computed=getComputedStyle(home);const styling={accent:computed.getPropertyValue('--violet').trim(),background:computed.getPropertyValue('--bg').trim()};const tweak=new Tweak({container:home,onChange:()=>{home.style.setProperty('--violet',styling.accent);home.style.setProperty('--bg',styling.background);}});tweak.addColorPicker(styling,'accent',{label:'Accent',reference:'--violet'});tweak.addColorPicker(styling,'background',{label:'Background',reference:'--bg'});}
    });
  })();
  </script>
</div>
